<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12364A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TIX·STUB｜票根收藏</title>
<style>
:root{--navy:#12364A;--blue:#3D9CC2;--ice:#EAF6FB;--paper:#F7FBFD;--white:#fff;--ink:#102A3A;--muted:#637985;--line:#C9DDE6;--danger:#B23A3A}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC",sans-serif;color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:30;background:rgba(247,251,253,.96);backdrop-filter:blur(16px);padding:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;color:var(--navy);font-size:27px}.brand h1 span{color:var(--blue)}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:12px}.search{margin-top:12px;position:relative}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:13px;padding:0 14px 0 40px;outline:none}.search:before{content:"⌕";position:absolute;left:14px;top:7px;font-size:24px;color:var(--muted);z-index:1}
.main-nav,.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.main-nav{margin-top:10px}.main-nav::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.nav-btn,.filter{flex:none;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:9px 12px;font-size:11px;font-weight:700}.nav-btn.active,.filter.active{background:var(--navy);border-color:var(--navy);color:#fff}
main{padding:12px 16px 100px}.view{display:none}.view.active{display:block}.filters{padding:2px 0 9px}.filter{padding:7px 10px}.filter.active{background:var(--ice);border-color:var(--blue);color:#2D789A}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:5px 0 13px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px}.stat b{display:block;font-size:18px;color:var(--navy)}.stat span,.muted{font-size:10px;color:var(--muted)}
.ticket{background:#fff;border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;box-shadow:0 5px 18px rgba(18,54,74,.06)}.ticket-top{display:flex;min-height:105px;cursor:pointer}.ticket-date{width:92px;flex:none;background:var(--ice);display:flex;flex-direction:column;justify-content:center;align-items:center}.ticket-date .m{font-size:10px;color:#2D789A;font-weight:800}.ticket-date .d{font-size:30px;font-weight:900;color:var(--navy)}.ticket-info{padding:14px;min-width:0}.ticket-title{font-weight:850;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticket-meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}.badge{display:inline-block;background:var(--ice);color:#2D789A;padding:4px 7px;border-radius:7px;font-size:10px;font-weight:800;margin-top:7px}
.ticket-actions{display:flex;border-top:1px solid var(--line)}.ticket-actions button{flex:1;border:0;border-right:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 3px;font-size:10px}.ticket-actions button:last-child{border:0}.danger{color:var(--danger)!important}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty .emoji{font-size:42px}.add-fab{position:fixed;right:20px;bottom:20px;z-index:40;width:58px;height:58px;border:0;border-radius:50%;background:var(--navy);color:#fff;font-size:28px;box-shadow:0 12px 28px #12364A44}
.modal{position:fixed;inset:0;background:#061B2777;z-index:80;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px 30px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-head h2{margin:0;color:var(--navy)}.close{width:36px;height:36px;border:0;background:var(--ice);border-radius:50%}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}.field textarea{min-height:80px}.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.cat-option{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 3px;text-align:center;font-size:9px;color:var(--muted)}.cat-option strong{display:block;font-size:19px}.cat-option.selected{background:var(--ice);border-color:var(--blue);color:#2D789A}
.photo-box{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:11px}.photo-box img{max-width:100%;max-height:220px;border-radius:10px}.form-actions{display:flex;gap:8px;margin-top:14px}.primary,.secondary{flex:1;border-radius:11px;padding:12px;border:1px solid var(--line);font-weight:800}.primary{background:var(--navy);color:#fff}.secondary{background:#fff;color:var(--navy)}
.detail-card,.calendar-card,.spend-card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.detail-photo{background:#061B27;display:flex;justify-content:center}.detail-photo img{width:100%;max-height:55vh;object-fit:contain}.detail-body,.calendar-card,.spend-card{padding:15px}.detail-body h2{margin:8px 0;color:var(--navy)}.detail-line{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.detail-line span{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.action-grid button{padding:11px;border:1px solid var(--line);background:#fff;border-radius:11px;color:var(--navy);font-weight:700;font-size:11px}
.event-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.event-row:last-child{border:0}.event-date{width:50px;background:var(--ice);border-radius:9px;text-align:center;padding:6px}.event-date .m{font-size:9px;color:#2D789A}.event-date .d{font-size:21px;font-weight:900;color:var(--navy)}.event-info{flex:1;min-width:0}.event-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.event-info span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.big-number{font-size:30px;font-weight:900;color:var(--navy)}.spend-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.mini{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.mini b{display:block;font-size:19px;color:#2D789A}.bar-row{display:grid;grid-template-columns:90px 1fr 70px;gap:7px;align-items:center;margin:9px 0;font-size:10px}.bar-track{height:8px;background:#D7EAF2;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--blue)}
.quick{position:fixed;inset:0;background:#061B27;z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.quick.open{display:flex}.quick-inner{text-align:center;color:#fff;width:100%}.quick img{max-width:100%;max-height:70vh;border-radius:14px;background:#fff}.quick h2{font-size:19px;margin:12px 0 4px}.quick p{color:#BBD7E2;font-size:11px}.quick-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff18;color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;background:var(--navy);color:#fff;border-radius:11px;padding:10px 14px;font-size:12px;z-index:150;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.cat-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><div><h1>TIX<span>·</span>STUB</h1><p>Collect Every Ticket Memory</p></div><button class="icon-btn" onclick="openSettings()">⚙️</button></div>
<div class="search"><input id="search" placeholder="搜尋活動、場地、座位、同行人、備註…" oninput="renderTickets()"></div>
<nav class="main-nav"><button class="nav-btn active" data-view="tickets" onclick="switchView('tickets')">🎟️ 我的票券</button><button class="nav-btn" data-view="calendar" onclick="switchView('calendar')">📅 行程</button><button class="nav-btn" data-view="spending" onclick="switchView('spending')">💰 消費分析</button></nav>
</header>
<main>
<section id="ticketsView" class="view active"><div class="filters" id="filters"></div><div class="stats" id="stats"></div><div id="ticketList"></div></section>
<section id="calendarView" class="view"><div id="calendarContent"></div></section>
<section id="spendingView" class="view"><div id="spendingContent"></div></section>
</main></div>
<button class="add-fab" onclick="openEditor()">＋</button>

<div class="modal" id="editorModal"><div class="sheet">
<div class="sheet-head"><h2 id="editorTitle">新增票券</h2><button class="close" onclick="closeEditor()">✕</button></div>
<form id="ticketForm" onsubmit="saveTicket(event)">
<input type="hidden" id="editId">
<div class="form-grid">
<div class="field full"><label>活動／行程名稱 *</label><input id="fTitle" required placeholder="例如：演唱會、高鐵、博物館…"></div>
<div class="field"><label>日期 *</label><input id="fDate" type="date" required></div><div class="field"><label>時間</label><input id="fTime" type="time"></div>
<div class="field"><label>場地／車站／機場</label><input id="fVenue"></div><div class="field"><label>座位／車廂／班次</label><input id="fSeat"></div>
<div class="field"><label>票價</label><input id="fPrice" type="number" min="0" step="1" placeholder="NT$"></div><div class="field"><label>同行人</label><input id="fCompanions"></div>
<div class="field full"><label>分類</label><div class="cat-grid" id="catGrid"></div></div>
<div class="field full"><label>票券照片／QR Code</label><div class="photo-box" id="photoBox"></div></div>
<div class="field full"><label>備註</label><textarea id="fNotes"></textarea></div>
</div>
<div class="form-actions"><button type="button" class="secondary" onclick="closeEditor()">取消</button><button class="primary">儲存票券</button></div>
</form></div></div>

<div class="modal" id="detailModal"><div class="sheet" id="detailContent"></div></div>
<div class="modal" id="settingsModal"><div class="sheet">
<div class="sheet-head"><h2>設定與備份</h2><button class="close" onclick="closeSettings()">✕</button></div>
<div class="calendar-card"><div class="section-title">💾 資料備份</div><p class="muted">匯出 JSON 可備份票券資料；在另一台裝置可匯入。</p><div class="form-actions"><button class="secondary" onclick="exportData()">⬇️ 匯出</button><button class="secondary" onclick="document.getElementById('importFile').click()">⬆️ 匯入</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></div></div>
<div class="calendar-card" style="margin-top:10px"><div class="section-title">🗑️ 清除資料</div><button class="secondary danger" style="width:100%" onclick="clearAll()">清除全部票券</button></div>
</div></div>
<div class="quick" id="quick"><button class="quick-close" onclick="closeQuick()">✕</button><div class="quick-inner"><div id="quickPhoto"></div><h2 id="quickTitle"></h2><p id="quickMeta"></p></div></div>
<div class="toast" id="toast"></div>

<script>
const CATS=[
["concert","演唱會","🎤"],["sports","球賽","⚾"],["museum","博物館","🏛️"],["exhibition","展覽","🖼️"],["movie","電影","🎬"],["theatre","舞台劇","🎭"],["festival","音樂祭","🎪"],["transport","交通","🚄"],["flight","飛機","✈️"],["rail","火車","🚆"],["bus","公車","🚌"],["metro","捷運","🚇"],["ferry","船票","⛴️"],["theme","樂園","🎡"],["aquarium","水族館","🐠"],["zoo","動物園","🦁"],["attraction","景點","📍"],["sports_event","運動活動","🏟️"],["other","其他","🎫"]];
const CM=Object.fromEntries(CATS.map(c=>[c[0],{id:c[0],label:c[1],icon:c[2]}]));const ALIAS={travel:"transport"};let tickets=load(),activeFilter="all",selectedCat="other",photoData="",toastTimer;
function load(){try{return JSON.parse(localStorage.getItem("tixstub_tickets")||"[]")}catch(e){return[]}}function persist(){localStorage.setItem("tixstub_tickets",JSON.stringify(tickets))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function cat(t){return CM[ALIAS[t.cat]||t.cat]||CM.other}function dObj(s){return s?new Date(s+"T00:00:00"):null}
function days(s){if(!s)return Infinity;const d=dObj(s),n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/86400000)}
function money(n){return "NT$ "+(Number(n)||0).toLocaleString()}
function toast(s){const x=document.getElementById("toast");x.textContent=s;x.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove("show"),2200)}
function renderFilters(){document.getElementById("filters").innerHTML=[["all","全部"],["upcoming","即將到來"],["used","已使用"],["favorite","收藏"]].map(x=>`<button class="filter ${activeFilter==x[0]?"active":""}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join("")+CATS.map(c=>`<button class="filter ${activeFilter=="cat:"+c[0]?"active":""}" onclick="setFilter('cat:${c[0]}')">${c[2]} ${c[1]}</button>`).join("")}
function setFilter(f){activeFilter=f;renderFilters();renderTickets()}
function renderStats(){const total=tickets.length,up=tickets.filter(t=>!t.used&&days(t.date)>=0).length,spent=tickets.reduce((s,t)=>s+(Number(t.price)||0),0);document.getElementById("stats").innerHTML=`<div class="stat"><b>${total}</b><span>全部票券</span></div><div class="stat"><b>${up}</b><span>即將到來</span></div><div class="stat"><b>${money(spent).replace("NT$ ","$")}</b><span>累計花費</span></div>`}
function match(t){const q=document.getElementById("search").value.trim().toLowerCase();if(q&&!([t.title,t.venue,t.seat,t.companions,t.notes,t.date,t.time,cat(t).label].some(v=>String(v||"").toLowerCase().includes(q))))return false;if(activeFilter=="upcoming")return !t.used&&days(t.date)>=0;if(activeFilter=="used")return !!t.used||days(t.date)<0;if(activeFilter=="favorite")return !!t.starred;if(activeFilter.startsWith("cat:"))return (ALIAS[t.cat]||t.cat)==activeFilter.slice(4);return true}
function countdown(t){const n=days(t.date);if(t.used)return"已使用";if(n<0)return"已過期";if(n==0)return"就是今天！";if(n==1)return"明天";return`還有 ${n} 天`}
function renderTickets(){renderStats();const arr=tickets.filter(match).sort((a,b)=>(a.date||"").localeCompare(b.date||"")),el=document.getElementById("ticketList");if(!arr.length){el.innerHTML='<div class="empty"><div class="emoji">🎟️</div><b>還沒有符合條件的票券</b><p>按右下角「＋」新增。</p></div>';return}el.innerHTML=arr.map(t=>{const d=dObj(t.date),c=cat(t);return`<article class="ticket"><div class="ticket-top" onclick="openDetail('${t.id}')"><div class="ticket-date">${d?`<div class="m">${d.getMonth()+1} 月</div><div class="d">${d.getDate()}</div>`:'<div class="d">—</div>'}</div><div class="ticket-info"><div class="ticket-title">${c.icon} ${esc(t.title||"未命名票券")}</div><div class="ticket-meta">${t.time?esc(t.time)+" · ":""}${t.venue?"📍 "+esc(t.venue):"場地未填"}${t.seat?" · "+esc(t.seat):""}</div><span class="badge">${c.label} · ${countdown(t)}</span></div></div><div class="ticket-actions"><button onclick="event.stopPropagation();quickShow('${t.id}')">🎟️ 出示</button><button onclick="event.stopPropagation();editTicket('${t.id}')">✏️ 編輯</button><button onclick="event.stopPropagation();toggleStar('${t.id}')">${t.starred?"★ 收藏":"☆ 收藏"}</button><button class="danger" onclick="event.stopPropagation();deleteTicket('${t.id}')">刪除</button></div></article>`}).join("")}
function switchView(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v+"View").classList.add("active");document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.view==v));if(v=="calendar")renderCalendar();if(v=="spending")renderSpending()}
function openEditor(id=null){document.getElementById("ticketForm").reset();photoData="";selectedCat="other";document.getElementById("editId").value="";document.getElementById("editorTitle").textContent=id?"編輯票券":"新增票券";if(id){const t=tickets.find(x=>x.id==id);if(!t)return;document.getElementById("editId").value=id;document.getElementById("fTitle").value=t.title||"";document.getElementById("fDate").value=t.date||"";document.getElementById("fTime").value=t.time||"";document.getElementById("fVenue").value=t.venue||"";document.getElementById("fSeat").value=t.seat||"";document.getElementById("fPrice").value=t.price||"";document.getElementById("fCompanions").value=t.companions||"";document.getElementById("fNotes").value=t.notes||"";selectedCat=ALIAS[t.cat]||t.cat||"other";photoData=t.photo||""}renderCats();renderPhoto();document.getElementById("editorModal").classList.add("open")}
function closeEditor(){document.getElementById("editorModal").classList.remove("open")}
function renderCats(){document.getElementById("catGrid").innerHTML=CATS.map(c=>`<button type="button" class="cat-option ${selectedCat==c[0]?"selected":""}" onclick="selectedCat='${c[0]}';renderCats()"><strong>${c[2]}</strong>${c[1]}</button>`).join("")}
function renderPhoto(){const el=document.getElementById("photoBox");el.innerHTML=photoData?`<img src="${photoData}"><div style="margin-top:8px"><button type="button" class="secondary" onclick="pickPhoto()">更換</button><button type="button" class="secondary" onclick="photoData='';renderPhoto()">移除</button></div>`:`點擊選擇照片<div style="margin-top:8px"><button type="button" class="secondary" onclick="pickPhoto()">📷 選擇照片</button></div>`}
function pickPhoto(){let i=document.getElementById("photoInput");if(!i){i=document.createElement("input");i.type="file";i.accept="image/*";i.capture="environment";i.id="photoInput";i.style.display="none";i.onchange=previewPhoto;document.body.appendChild(i)}i.click()}
function previewPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoData=r.result;renderPhoto()};r.readAsDataURL(f)}
function saveTicket(e){e.preventDefault();const id=document.getElementById("editId").value,old=tickets.find(t=>t.id==id),t={id:id||uid(),title:document.getElementById("fTitle").value.trim(),date:document.getElementById("fDate").value,time:document.getElementById("fTime").value,venue:document.getElementById("fVenue").value.trim(),seat:document.getElementById("fSeat").value.trim(),price:document.getElementById("fPrice").value,companions:document.getElementById("fCompanions").value.trim(),cat:selectedCat,photo:photoData,notes:document.getElementById("fNotes").value.trim(),used:old?.used||false,starred:old?.starred||false};const i=tickets.findIndex(x=>x.id==t.id);if(i>=0)tickets[i]=t;else tickets.push(t);persist();closeEditor();switchView("tickets");renderFilters();renderTickets();toast(id?"票券已更新":"票券已新增")}
function editTicket(id){closeDetail();openEditor(id)}
function deleteTicket(id){const t=tickets.find(x=>x.id==id);if(!t)return;if(confirm(`確定刪除「${t.title||"這張票"}」嗎？`)){tickets=tickets.filter(x=>x.id!=id);persist();closeDetail();renderTickets();toast("票券已刪除")}}
function toggleStar(id){const t=tickets.find(x=>x.id==id);if(!t)return;t.starred=!t.starred;persist();renderTickets();toast(t.starred?"已加入收藏":"已取消收藏")}
function toggleUsed(id){const t=tickets.find(x=>x.id==id);if(!t)return;t.used=!t.used;persist();renderTickets();openDetail(id);toast(t.used?"已標記已使用":"已恢復未使用")}
function openDetail(id){const t=tickets.find(x=>x.id==id);if(!t)return;const c=cat(t);document.getElementById("detailContent").innerHTML=`<div class="sheet-head"><h2>票券詳情</h2><button class="close" onclick="closeDetail()">✕</button></div><div class="detail-card">${t.photo?`<div class="detail-photo"><img src="${t.photo}"></div>`:""}<div class="detail-body"><div class="badge">${c.icon} ${c.label}</div><h2>${esc(t.title||"未命名票券")}</h2>${t.date?`<div class="detail-line"><span>日期</span>${t.date}${t.time?" · "+t.time:""}</div>`:""}${t.venue?`<div class="detail-line"><span>場地／交通地點</span>${esc(t.venue)}</div>`:""}${t.seat?`<div class="detail-line"><span>座位／車廂／班次</span>${esc(t.seat)}</div>`:""}${t.price!==""?`<div class="detail-line"><span>票價</span>${money(t.price)}</div>`:""}${t.companions?`<div class="detail-line"><span>同行人</span>${esc(t.companions)}</div>`:""}${t.notes?`<div class="detail-line"><span>備註</span>${esc(t.notes)}</div>`:""}<div class="action-grid"><button onclick="quickShow('${t.id}')">🎟️ 快速出示</button><button onclick="openMap('${esc(t.venue||"")}')">📍 地圖</button><button onclick="addCalendar('${t.id}')">📅 加入行程</button><button onclick="toggleUsed('${t.id}')">${t.used?"↩️ 未使用":"✓ 已使用"}</button><button onclick="editTicket('${t.id}')">✏️ 編輯</button><button onclick="toggleStar('${t.id}')">${t.starred?"★ 取消收藏":"☆ 加入收藏"}</button><button class="danger" onclick="deleteTicket('${t.id}')">🗑️ 刪除</button></div></div></div>`;document.getElementById("detailModal").classList.add("open")}
function closeDetail(){document.getElementById("detailModal").classList.remove("open")}
function quickShow(id){const t=tickets.find(x=>x.id==id);if(!t)return;document.getElementById("quickTitle").textContent=t.title||"票券";document.getElementById("quickMeta").textContent=[t.date,t.time,t.venue,t.seat].filter(Boolean).join(" · ");document.getElementById("quickPhoto").innerHTML=t.photo?`<img src="${t.photo}">`:`<div style="padding:70px 20px;color:#BBD7E2">這張票沒有上傳照片</div>`;document.getElementById("quick").classList.add("open")}
function closeQuick(){document.getElementById("quick").classList.remove("open")}
function openMap(v){if(!v){toast("這張票沒有填寫場地");return}const q=encodeURIComponent(v);window.open(/iPhone|iPad|iPod/i.test(navigator.userAgent)?`https://maps.apple.com/?q=${q}`:`https://www.google.com/maps/search/?api=1&query=${q}`,"_blank")}
function addCalendar(id){const t=tickets.find(x=>x.id==id);if(!t||!t.date){toast("請先填寫日期");return}const p=n=>String(n).padStart(2,"0"),d=new Date(t.date+"T"+(t.time||"09:00")+":00"),f=x=>x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())+"T"+p(x.getHours())+p(x.getMinutes())+p(x.getSeconds()),ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//TIX-STUB//EN\r\nBEGIN:VEVENT\r\nUID:${t.id}@tixstub\r\nDTSTART:${f(d)}\r\nSUMMARY:${String(t.title||"活動").replace(/[,;]/g," ")}\r\nLOCATION:${String(t.venue||"").replace(/[,;]/g," ")}\r\nDESCRIPTION:${String(t.notes||"").replace(/\n/g," ")}\r\nEND:VEVENT\r\nEND:VCALENDAR`;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="tixstub-event.ics";a.click();toast("已建立行程檔案")}
function renderCalendar(){const up=tickets.filter(t=>!t.used&&t.date&&days(t.date)>=0).sort((a,b)=>a.date.localeCompare(b.date)),old=tickets.filter(t=>t.date&&(t.used||days(t.date)<0)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20),rows=a=>a.length?a.map(t=>{const d=dObj(t.date),c=cat(t);return`<div class="event-row" onclick="openDetail('${t.id}')"><div class="event-date"><div class="m">${d.getMonth()+1}月</div><div class="d">${d.getDate()}</div></div><div class="event-info"><b>${c.icon} ${esc(t.title)}</b><span>${t.time||"時間未填"}${t.venue?" · "+esc(t.venue):""}</span></div></div>`}).join(""):`<div class="muted">目前沒有資料</div>`;document.getElementById("calendarContent").innerHTML=`<div class="calendar-card"><div class="section-title">📅 即將到來</div>${rows(up)}</div><div class="calendar-card" style="margin-top:10px"><div class="section-title">🗂️ 已完成／過期</div>${rows(old)}</div>`}
function renderSpending(){const total=tickets.reduce((s,t)=>s+(Number(t.price)||0),0),priced=tickets.filter(t=>Number(t.price)>0),avg=priced.length?total/priced.length:0,byCat={},byMonth={};tickets.forEach(t=>{const n=Number(t.price)||0,c=cat(t).id;byCat[c]=(byCat[c]||0)+n;if(t.date){const m=t.date.slice(0,7);byMonth[m]=(byMonth[m]||0)+n}});const ent=Object.entries(byCat).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...ent.map(x=>x[1])),top=priced.sort((a,b)=>Number(b.price)-Number(a.price))[0];document.getElementById("spendingContent").innerHTML=`<div class="spend-card"><div class="muted">累計花費</div><div class="big-number">${money(total)}</div></div><div class="spend-grid"><div class="mini"><b>${money(avg)}</b><span class="muted">平均票價</span></div><div class="mini"><b>${priced.length}</b><span class="muted">有票價資料</span></div></div>${top?`<div class="spend-card"><div class="muted">最貴的一張票</div><b>${esc(top.title)}</b><div class="big-number" style="font-size:22px">${money(top.price)}</div></div>`:""}<div class="spend-card" style="margin-top:8px"><div class="section-title">各分類花費</div>${ent.length?ent.map(([id,n])=>{const c=CM[id]||CM.other;return`<div class="bar-row"><div>${c.icon} ${c.label}</div><div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div><div>${money(n).replace("NT$ ","$")}</div></div>`}).join(""):"<div class='muted'>尚無票價資料</div>"}</div><div class="spend-card" style="margin-top:8px"><div class="section-title">每月花費</div>${Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,n])=>`<div class="event-row" style="cursor:default"><div class="event-info"><b>${m}</b></div><strong>${money(n)}</strong></div>`).join("")||"<div class='muted'>尚無資料</div>"}</div>`}
function openSettings(){document.getElementById("settingsModal").classList.add("open")}function closeSettings(){document.getElementById("settingsModal").classList.remove("open")}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"TIX-STUB",version:4,tickets},null,2)],{type:"application/json"}));a.download="tix-stub-backup.json";a.click();toast("備份已匯出")}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),a=Array.isArray(x)?x:x.tickets;if(!Array.isArray(a))throw 0;tickets=a;persist();renderFilters();renderTickets();toast("備份已還原")}catch(_){toast("備份格式不正確")}};r.readAsText(f);e.target.value=""}
function clearAll(){if(!tickets.length){toast("目前沒有票券");return}if(confirm("確定要刪除全部票券嗎？")){tickets=[];persist();closeSettings();renderTickets();toast("已清除全部票券")}}
renderFilters();renderTickets();
</script>
</body>
</html>
