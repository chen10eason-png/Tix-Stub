<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12364A">
<title>TIX·STUB｜票根收藏</title>
<style>
:root{--navy:#12364A;--navy2:#0B2939;--ice:#E8F5FA;--blue:#3D9CC2;--paper:#F7FBFD;--line:#C9DDE6;--muted:#607783;--danger:#B53D4A;--white:#fff}
*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--navy2);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(247,251,253,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:16px 16px 10px}
.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:25px;letter-spacing:1px}.brand h1 span{color:var(--blue)}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}
.icon-btn,.filter,.nav-btn,.cat,.secondary{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:11px}.icon-btn{padding:9px 11px;font-weight:700}
.main-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.nav-btn{padding:10px 4px;color:var(--muted);font-size:12px;font-weight:800}.nav-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
main{max-width:760px;margin:auto;padding-bottom:100px}.toolbar{padding:12px 16px 4px}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 14px;outline:0}.filters{display:flex;gap:7px;overflow:auto;padding:10px 0 5px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;padding:7px 10px;font-size:11px;color:var(--muted)}.filter.active{background:var(--ice);border-color:#9BCBDD;font-weight:800}
.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px}.stat b{font-size:18px}.stat span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.cards{padding:8px 16px}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:38px 20px;text-align:center;color:var(--muted)}
.ticket{background:#fff;border:1px solid var(--line);border-radius:17px;margin:10px 0;box-shadow:0 8px 24px rgba(18,54,74,.09);overflow:hidden}.ticket-top{display:flex;gap:12px;padding:14px}.ticket-thumb{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--ice);flex:none}.ticket-info{min-width:0;flex:1}.ticket-title{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticket-meta{font-size:11px;color:var(--muted);line-height:1.65;margin-top:4px}.badge{display:inline-block;background:var(--ice);color:var(--navy);border-radius:8px;padding:3px 7px;font-size:10px;font-weight:800;margin-top:5px}
.ticket-actions{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.ticket-actions button{border:0;border-right:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 4px;font-size:11px;font-weight:800}.ticket-actions button:last-child{border-right:0}.ticket-actions .danger{color:var(--danger)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;border:0;background:var(--navy);color:#fff;border-radius:18px;padding:14px 18px;font-weight:900;box-shadow:0 10px 28px rgba(18,54,74,.28)}
.modal{display:none;position:fixed;inset:0;background:rgba(4,22,31,.52);z-index:50;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{overflow-x:hidden;overscroll-behavior-x:none;width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet h2{margin:0;font-size:20px}.close{border:0;background:#E3EEF2;border-radius:50%;width:36px;height:36px;color:var(--navy)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:800}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;outline:0}.field textarea{min-height:75px}.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.cat{padding:8px 3px;text-align:center;font-size:10px;color:var(--muted)}.cat strong{display:block;font-size:18px}.cat.selected{background:var(--ice);border-color:#8FC7D9;color:var(--navy);font-weight:800}.photo-box{border:1px dashed #9CBBC7;border-radius:13px;padding:15px;text-align:center;background:#fff}.photo-box img{max-width:100%;max-height:180px;border-radius:10px}.photo-single-btn{margin-top:10px;width:100%}.photo-btn{margin-top:0}.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.form-actions .secondary,.form-actions .primary{margin-top:0;width:100%}.primary{width:100%;border:0;background:var(--navy);color:#fff;border-radius:12px;padding:12px;font-weight:900;margin-top:14px}.secondary{width:100%;padding:11px;font-weight:800;margin-top:8px}
.detail-photo{width:100%;max-height:45vh;object-fit:contain;border-radius:15px;background:#fff;border:1px solid var(--line)}.action-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.action-row button{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:11px;padding:10px;font-weight:800;font-size:12px}
.calendar-card,.spend-card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:10px 16px;padding:15px;box-shadow:0 8px 24px rgba(18,54,74,.07)}.section-title{font-weight:900;font-size:17px;margin-bottom:10px}.event{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #E1EDF2}.event:last-child{border-bottom:0}.datebox{width:50px;background:var(--ice);border-radius:10px;text-align:center;padding:6px;flex:none}.datebox small{display:block;color:var(--blue);font-size:9px;font-weight:800}.datebox b{font-size:20px}.event-main{flex:1;min-width:0}.event-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-main span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.big-money{font-size:31px;font-weight:900}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 16px}.mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.mini b{font-size:20px}.mini span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.bar{margin:9px 0}.bar-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}.track{height:8px;background:var(--ice);border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:8px}
.quick{display:none;position:fixed;inset:0;background:#071E2B;z-index:100;color:#fff;align-items:center;justify-content:center;padding:20px}.quick.open{display:flex}.quick-inner{width:min(600px,100%);text-align:center}.quick img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:14px;background:#fff}.quick-close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:50%;width:40px;height:40px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:150;background:#102F40;color:#fff;padding:10px 15px;border-radius:12px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:430px){.form-grid{grid-template-columns:1fr 1fr}}
.settings-block{margin:14px 0}.settings-block h3{margin:0 0 9px;font-size:14px}.language-options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.language-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:11px;padding:11px 6px;font-weight:800;font-size:12px}.language-btn.active{background:var(--ice);border-color:#9BCBDD}.confirm-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.confirm-card h3{margin:0 0 8px;font-size:17px}.confirm-card p{color:var(--muted);font-size:12px;line-height:1.7;margin:0}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.danger{color:var(--danger)!important}</style>
</head>
<body>
<header><div class="brand"><div><h1>TIX<span>·</span>STUB</h1><p>Collect your tickets & memories</p></div><button class="icon-btn" onclick="openSettings()">⚙️</button></div>
<nav class="main-nav"><button class="nav-btn active" data-view="tickets" onclick="switchView('tickets')">🎟️ 我的票券</button><button class="nav-btn" data-view="calendar" onclick="switchView('calendar')">📅 行程</button><button class="nav-btn" data-view="spending" onclick="switchView('spending')">💰 消費分析</button></nav></header>
<main>
<section id="ticketsView" class="view active"><div class="toolbar"><input id="search" class="search" placeholder="搜尋活動、場地、座位、同行人、備註…" oninput="renderTickets()"><div id="filters" class="filters"></div></div><div id="stats" class="stats"></div><div id="cards" class="cards"></div></section>
<section id="calendarView" class="view"><div id="calendarContent"></div></section><section id="spendingView" class="view"><div id="spendingContent"></div></section></main>
<button class="fab" onclick="openForm()">＋ 新增票券</button>

<div id="formModal" class="modal" onclick="backdrop(event,'formModal')"><div class="sheet"><div class="sheet-head"><h2 id="formTitle">新增票券</h2><button class="close" onclick="closeModal('formModal')">✕</button></div>
<form id="ticketForm" onsubmit="saveTicket(event)"><input type="hidden" id="editId"><div class="form-grid">
<div class="field full"><label>活動／班次名稱 *</label><input id="title" required placeholder="例如：五月天演唱會"></div><div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>時間</label><input id="time" type="time"></div><div class="field full"><label>場地／車站／機場</label><input id="venue" placeholder="例如：台北小巨蛋"></div><div class="field"><label>座位／車廂</label><input id="seat" placeholder="例如：A區 12排"></div><div class="field"><label>票價（NT$）</label><input id="price" type="number" min="0" step="1" placeholder="1500"></div><div class="field full"><label>同行人</label><input id="companions" placeholder="例如：Ray、小明"></div><div class="field full"><label>備註</label><textarea id="notes"></textarea></div><div class="field full"><label>分類</label><div id="catgrid" class="catgrid"></div></div>
<div class="field full"><label>票券照片</label><div class="photo-box"><div id="photoPreview">尚未選擇照片</div><div class="photo-pick-actions"><button type="button" class="secondary photo-btn" onclick="pickPhoto()">🖼️ 選擇照片</button></div><input id="photoPhotos" type="file" accept="image/*" style="display:none" onchange="previewPhoto(event)"></div></div></div><div class="form-actions"><button type="button" class="secondary form-cancel" onclick="closeModal('formModal')">取消</button><button class="primary form-save" type="submit">💾 儲存票券</button></div></form></div></div>

<div id="detailModal" class="modal" onclick="backdrop(event,'detailModal')"><div class="sheet"><div class="sheet-head"><h2>票券詳情</h2><button class="close" onclick="closeModal('detailModal')">✕</button></div><div id="detailContent"></div></div></div>
<div id="settingsModal" class="modal" onclick="backdrop(event,'settingsModal')"><div class="sheet"><div class="sheet-head"><h2 id="settingsTitle">⚙️ 設定</h2><button class="close" onclick="closeModal('settingsModal')">✕</button></div><button class="secondary" onclick="exportData()" id="exportBtn">📦 匯出票券備份</button><button class="secondary" onclick="document.getElementById('importFile').click()" id="importBtn">📥 還原票券備份</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"><div class="settings-block"><h3 id="languageTitle">🌐 語言</h3><div class="language-options"><button type="button" class="language-btn" data-lang="zh" onclick="setLanguage('zh')">繁體中文</button><button type="button" class="language-btn" data-lang="en" onclick="setLanguage('en')">English</button><button type="button" class="language-btn" data-lang="ja" onclick="setLanguage('ja')">日本語</button></div></div><button class="secondary" onclick="confirmClearAll()" style="color:var(--danger)" id="clearBtn">🗑️ 清除全部票券</button></div></div>
<div id="confirmModal" class="modal" onclick="backdrop(event,'confirmModal')"><div class="sheet"><div class="sheet-head"><h2 id="confirmTitle">⚠️ 確認操作</h2><button class="close" onclick="closeModal('confirmModal')">✕</button></div><div class="confirm-card"><h3 id="confirmQuestion">確定要清除全部票券嗎？</h3><p id="confirmDescription">這個操作會刪除目前裝置上的所有票券資料，而且無法復原。建議先匯出備份。</p><div class="confirm-actions"><button class="secondary" onclick="closeModal('confirmModal')" id="cancelClearBtn">取消</button><button class="secondary danger" onclick="doClearAll()" id="confirmClearBtn">確定清除</button></div></div></div></div>
<div id="quick" class="quick"><button class="quick-close" onclick="closeQuick()">✕</button><div class="quick-inner"><div id="quickPhoto"></div><h2 id="quickTitle"></h2><p id="quickMeta"></p></div></div><div id="toast" class="toast"></div>

<script>
const CATS=[
['concert','演唱會','🎤'],['sports','球賽','⚾'],['museum','博物館','🏛️'],['exhibition','展覽','🖼️'],['movie','電影','🎬'],['theatre','舞台劇','🎭'],['festival','音樂祭','🎪'],['transport','交通','🚄'],['flight','飛機','✈️'],['rail','火車','🚆'],['bus','公車','🚌'],['metro','捷運','🚇'],['ferry','船票','⛴️'],['theme','樂園','🎡'],['aquarium','水族館','🐠'],['zoo','動物園','🦁'],['attraction','景點','📍'],['sports_event','運動活動','🏟️'],['other','其他','🎫']];
const catMap=Object.fromEntries(CATS.map(c=>[c[0],{id:c[0],label:c[1],icon:c[2]}]));
let tickets=[],filter='all',selectedCat='other';

function load(){try{tickets=JSON.parse(localStorage.getItem('tixstub_v4')||'[]')}catch(e){tickets=[]}renderFilters();renderCatGrid();renderTickets()}
function persist(){localStorage.setItem('tixstub_v4',JSON.stringify(tickets))}
function uid(){return 't_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function daysUntil(d){if(!d)return null;let a=new Date();a.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-a)/86400000)}
function money(n){return 'NT$ '+(Number(n)||0).toLocaleString()}
function formatDate(d){if(!d)return '';let x=new Date(d+'T00:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}`}
function renderFilters(){document.getElementById('filters').innerHTML='<button class="filter '+(filter==='all'?'active':'')+'" onclick="setFilter(\'all\')">全部</button><button class="filter '+(filter==='upcoming'?'active':'')+'" onclick="setFilter(\'upcoming\')">即將到來</button><button class="filter '+(filter==='used'?'active':'')+'" onclick="setFilter(\'used\')">已使用</button><button class="filter '+(filter==='fav'?'active':'')+'" onclick="setFilter(\'fav\')">收藏</button>'+CATS.map(c=>`<button class="filter ${filter===c[0]?'active':''}" onclick="setFilter('${c[0]}')">${c[2]} ${c[1]}</button>`).join('')}
function setFilter(f){filter=f;renderFilters();renderTickets()}
function renderStats(){let total=tickets.length,up=tickets.filter(t=>!t.used&&daysUntil(t.date)>=0).length,spent=tickets.reduce((s,t)=>s+(Number(t.price)||0),0);document.getElementById('stats').innerHTML=`<div class="stat"><b>${total}</b><span>全部票券</span></div><div class="stat"><b>${up}</b><span>即將到來</span></div><div class="stat"><b>${money(spent).replace('NT$ ','')}</b><span>累計花費</span></div>`}
function filtered(){let q=document.getElementById('search').value.trim().toLowerCase();return tickets.filter(t=>{if(filter==='upcoming'&&(t.used||daysUntil(t.date)<0))return false;if(filter==='used'&&!t.used)return false;if(filter==='fav'&&!t.starred)return false;if(catMap[filter]&&t.cat!==filter)return false;if(q&&!['title','venue','seat','companions','notes','date','time'].some(k=>String(t[k]||'').toLowerCase().includes(q)))return false;return true}).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))}
function renderTickets(){renderStats();let a=filtered(),el=document.getElementById('cards');if(!a.length){el.innerHTML='<div class="empty">🎟️<br><br>目前沒有符合條件的票券<br><small>點右下角「＋ 新增票券」開始收藏</small></div>';return}el.innerHTML=a.map(t=>{let c=catMap[t.cat]||catMap.other,du=daysUntil(t.date),status=t.used?'已使用':du===null?'日期未填':du===0?'就是今天！':du>0?'還有 '+du+' 天':'已過期';return `<article class="ticket"><div class="ticket-top" onclick="openDetail('${t.id}')">${t.photo?`<img class="ticket-thumb" src="${t.photo}" alt="">`:`<div class="ticket-thumb" style="display:grid;place-items:center;font-size:34px">${c.icon}</div>`}<div class="ticket-info"><div class="ticket-title">${esc(t.title||'未命名活動')}</div><div class="ticket-meta">${t.date?formatDate(t.date):'日期未填'}${t.time?' · '+esc(t.time):''}<br>${t.venue?'📍 '+esc(t.venue):''}${t.seat?' · '+esc(t.seat):''}</div><span class="badge">${c.icon} ${c.label} · ${status}</span></div><div>${t.starred?'★':''}</div></div><div class="ticket-actions"><button onclick="quickShow('${t.id}')">🎟️ 出示</button><button onclick="editTicket('${t.id}')">✏️ 編輯</button><button class="danger" onclick="deleteTicket('${t.id}')">🗑️ 刪除</button></div></article>`}).join('')}
function renderCatGrid(){document.getElementById('catgrid').innerHTML=CATS.map(c=>`<button type="button" class="cat ${selectedCat===c[0]?'selected':''}" onclick="selectedCat='${c[0]}';renderCatGrid()"><strong>${c[2]}</strong>${c[1]}</button>`).join('')}
function openForm(id=null){document.getElementById('ticketForm').reset();document.getElementById('editId').value=id||'';selectedCat=id?(tickets.find(t=>t.id===id)?.cat||'other'):'other';document.getElementById('photoPhotos').value='';document.getElementById('formTitle').textContent=id?'編輯票券':'新增票券';document.getElementById('photoPreview').innerHTML=L().noPhoto;if(id){let t=tickets.find(x=>x.id===id);['title','date','time','venue','seat','price','companions','notes'].forEach(k=>document.getElementById(k).value=t[k]||'');document.getElementById('photoPreview').innerHTML=t.photo?`<img src="${t.photo}" alt="">`:L().noPhoto}renderCatGrid();applyLanguage();let sh=document.querySelector('#formModal .sheet');if(sh)sh.scrollTop=0;document.getElementById('formModal').classList.add('open')}
function editTicket(id){openForm(id)}
function pickPhoto(){document.getElementById('photoPhotos').click()}
function previewPhoto(e){let f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast(appLang==='zh'?'請選擇圖片檔案':appLang==='ja'?'画像ファイルを選択してください':'Please choose an image file');e.target.value='';return}let r=new FileReader();r.onload=()=>{document.getElementById('photoPreview').innerHTML=`<img src="${r.result}" alt="">`;window._selectedPhotoData=r.result};r.readAsDataURL(f)}
function saveTicket(e){e.preventDefault();let id=document.getElementById('editId').value,old=tickets.find(t=>t.id===id),f=document.getElementById('photoPhotos').files[0],finish=photo=>{let d={id:id||uid(),title:title.value.trim(),date:date.value,time:time.value,venue:venue.value.trim(),seat:seat.value.trim(),price:price.value,companions:companions.value.trim(),notes:notes.value.trim(),cat:selectedCat,photo,used:old?.used||false,starred:old?.starred||false,createdAt:old?.createdAt||Date.now()};tickets=id?tickets.map(t=>t.id===id?d:t):[...tickets,d];persist();closeModal('formModal');renderTickets();toast(id?'已更新票券':'已新增票券')};if(f){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(old?.photo||'')}
function deleteTicket(id){let t=tickets.find(x=>x.id===id);if(!t)return;if(confirm(`確定要刪除「${t.title||'這張票券'}」嗎？`)){tickets=tickets.filter(x=>x.id!==id);persist();renderTickets();toast('已刪除')}}
function openDetail(id){let t=tickets.find(x=>x.id===id),c=catMap[t.cat]||catMap.other;if(!t)return;document.getElementById('detailContent').innerHTML=`${t.photo?`<img class="detail-photo" src="${t.photo}" alt="">`:`<div style="height:180px;border:1px dashed var(--line);border-radius:15px;display:grid;place-items:center;font-size:60px;background:#fff">${c.icon}</div>`}<h2>${esc(t.title)}</h2><span class="badge">${c.icon} ${c.label}</span><p style="color:var(--muted);line-height:1.8">${t.date?'📅 '+formatDate(t.date):''}${t.time?' · ⏰ '+t.time:''}<br>${t.venue?'📍 '+esc(t.venue):''}<br>${t.seat?'💺 '+esc(t.seat):''}<br>${t.price?money(t.price):''}${t.companions?'<br>👥 '+esc(t.companions):''}${t.notes?'<br>📝 '+esc(t.notes):''}</p><div class="action-row"><button onclick="quickShow('${id}')">🎟️ 快速出示</button><button onclick="toggleStar('${id}')">${t.starred?'★ 取消收藏':'☆ 收藏'}</button><button onclick="openMap('${t.venue}')">📍 前往場地</button><button onclick="downloadICS('${id}')">📅 加入行程</button><button onclick="toggleUsed('${id}')">${t.used?'↩️ 標記未使用':'✓ 標記已使用'}</button><button onclick="duplicateTicket('${id}')">➕ 複製票券</button><button onclick="editTicket('${id}');closeModal('detailModal')">✏️ 編輯</button><button onclick="deleteTicket('${id}');closeModal('detailModal')">🗑️ 刪除</button></div>`;document.getElementById('detailModal').classList.add('open')}
function toggleStar(id){let t=tickets.find(x=>x.id===id);t.starred=!t.starred;persist();renderTickets();openDetail(id);toast(t.starred?'已加入收藏':'已取消收藏')}
function toggleUsed(id){let t=tickets.find(x=>x.id===id);t.used=!t.used;persist();renderTickets();openDetail(id);toast(t.used?'已標記使用':'已恢復未使用')}
function duplicateTicket(id){let t=tickets.find(x=>x.id===id);tickets.push({...t,id:uid(),title:(t.title||'票券')+'（同行票）',used:false,starred:false});persist();renderTickets();closeModal('detailModal');toast('已複製票券')}
function quickShow(id){let t=tickets.find(x=>x.id===id),c=catMap[t.cat]||catMap.other;document.getElementById('quickTitle').textContent=t.title||'未命名活動';document.getElementById('quickMeta').textContent=[t.date?formatDate(t.date):'',t.time||'',t.venue||'',t.seat||''].filter(Boolean).join(' · ');document.getElementById('quickPhoto').innerHTML=t.photo?`<img src="${t.photo}" alt="">`:`<div style="font-size:80px">${c.icon}</div>`;document.getElementById('quick').classList.add('open')}

function openMap(v){if(!v){toast('請先填寫場地');return}window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v),'_blank')}
function downloadICS(id){let t=tickets.find(x=>x.id===id);if(!t?.date){toast('請先填寫活動日期');return}let start=new Date(t.date+'T'+(t.time||'00:00')+':00'),end=new Date(start.getTime()+7200000),pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds()),ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TIX-STUB//ZH','BEGIN:VEVENT','UID:'+t.id+'@tixstub','DTSTAMP:'+fmt(new Date()),'DTSTART:'+fmt(start),'DTEND:'+fmt(end),'SUMMARY:'+t.title,'LOCATION:'+(t.venue||''),'DESCRIPTION:'+(t.notes||''),'END:VEVENT','END:VCALENDAR'].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download=(t.title||'event')+'.ics';a.click();toast('已建立行程檔案')}
function renderCalendar(){let up=tickets.filter(t=>!t.used&&t.date&&daysUntil(t.date)>=0).sort((a,b)=>a.date.localeCompare(b.date)),past=tickets.filter(t=>t.date&&(t.used||daysUntil(t.date)<0)).sort((a,b)=>b.date.localeCompare(a.date));let rows=a=>a.length?a.map(t=>{let d=new Date(t.date+'T00:00:00'),c=catMap[t.cat]||catMap.other;return `<div class="event" onclick="openDetail('${t.id}')"><div class="datebox"><small>${d.getMonth()+1}月</small><b>${d.getDate()}</b></div><div class="event-main"><b>${c.icon} ${esc(t.title)}</b><span>${t.time||'時間未填'}${t.venue?' · 📍 '+esc(t.venue):''}</span></div></div>`}).join(''):'<div style="color:var(--muted);font-size:12px">目前沒有資料</div>';document.getElementById('calendarContent').innerHTML=`<div class="calendar-card"><div class="section-title">📅 即將到來</div>${rows(up)}</div><div class="calendar-card"><div class="section-title">🗂️ 已完成／過期</div>${rows(past)}</div>`}
function renderSpending(){let total=tickets.reduce((s,t)=>s+(Number(t.price)||0),0),p=tickets.filter(t=>Number(t.price)>0),avg=p.length?total/p.length:0,by={};tickets.forEach(t=>by[t.cat]=(by[t.cat]||0)+(Number(t.price)||0));let e=Object.entries(by).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),max=e[0]?.[1]||1,top=p.sort((a,b)=>b.price-a.price)[0];document.getElementById('spendingContent').innerHTML=`<div class="spend-card"><div style="color:var(--muted);font-size:11px">累計花費</div><div class="big-money">${money(total)}</div></div><div class="mini-grid"><div class="mini"><b>${money(Math.round(avg))}</b><span>平均票價</span></div><div class="mini"><b>${p.length}</b><span>有票價的票券</span></div></div>${top?`<div class="spend-card"><div style="color:var(--muted);font-size:11px">最貴的一張票</div><b>${esc(top.title)}</b><div style="font-size:21px;font-weight:900">${money(top.price)}</div></div>`:''}<div class="spend-card"><div class="section-title">💰 各分類花費</div>${e.length?e.map(([id,n])=>{let c=catMap[id]||catMap.other;return `<div class="bar"><div class="bar-label"><span>${c.icon} ${c.label}</span><b>${money(Math.round(n))}</b></div><div class="track"><div class="fill" style="width:${n/max*100}%"></div></div></div>`}).join(''):'<div style="color:var(--muted);font-size:12px">填寫票價後就會出現分析</div>'}</div>`}

function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tickets,null,2)],{type:'application/json'}));a.download='TIX-STUB-backup.json';a.click();toast('備份已匯出')}

function renderCatGrid(){document.getElementById('catgrid').innerHTML=CATS.map(c=>`<button type="button" class="cat ${selectedCat===c[0]?'selected':''}" onclick="selectedCat='${c[0]}';renderCatGrid()"><strong>${c[2]}</strong>${catName(c[0])}</button>`).join('')}
function statusText(t){let d=daysUntil(t.date);return t.used?L().used:d===null?L().dateMissing:d===0?L().today:d>0?L().days.replace('{n}',d):L().expired}
function renderTickets(){renderStats();let a=filtered(),el=document.getElementById('cards');if(!a.length){el.innerHTML=`<div class="empty">🎟️<br><br>${L().empty}<br><small>${L().emptyHint}</small></div>`;return}el.innerHTML=a.map(t=>{let c=catMap[t.cat]||catMap.other;return `<article class="ticket"><div class="ticket-top" onclick="openDetail('${t.id}')">${t.photo?`<img class="ticket-thumb" src="${t.photo}" alt="">`:`<div class="ticket-thumb" style="display:grid;place-items:center;font-size:34px">${c.icon}</div>`}<div class="ticket-info"><div class="ticket-title">${esc(t.title||L().unnamed)}</div><div class="ticket-meta">${t.date?formatDate(t.date):L().dateMissing}${t.time?' · '+esc(t.time):''}<br>${t.venue?'📍 '+esc(t.venue):''}${t.seat?' · '+esc(t.seat):''}</div><span class="badge">${c.icon} ${catName(t.cat)} · ${statusText(t)}</span></div><div>${t.starred?'★':''}</div></div><div class="ticket-actions"><button onclick="event.stopPropagation();quickShow('${t.id}')">${L().show}</button><button onclick="event.stopPropagation();editTicket('${t.id}')">${L().edit}</button><button class="danger" onclick="event.stopPropagation();deleteTicket('${t.id}')">${L().delete}</button></div></article>`}).join('')}
function openForm(id=null){document.getElementById('ticketForm').reset();document.getElementById('editId').value=id||'';selectedCat=id?(tickets.find(t=>t.id===id)?.cat||'other'):'other';document.getElementById('photoPreview').innerHTML=L().noPhoto;if(id){let t=tickets.find(x=>x.id===id);['title','date','time','venue','seat','price','companions','notes'].forEach(k=>document.getElementById(k).value=t[k]||'');document.getElementById('photoPreview').innerHTML=t.photo?`<img src="${t.photo}" alt="">`:L().noPhoto}document.getElementById('formTitle').textContent=id?L().editTicket:L().newTicket;renderCatGrid();let sh=document.querySelector('#formModal .sheet');if(sh)sh.scrollTop=0;document.getElementById('formModal').classList.add('open')}
function pickPhoto(){document.getElementById('photoPhotos').click()}
function previewPhoto(e){let f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast(appLang==='zh'?'請選擇圖片檔案':appLang==='ja'?'画像ファイルを選択してください':'Please choose an image file');e.target.value='';return}let r=new FileReader();r.onload=()=>{document.getElementById('photoPreview').innerHTML=`<img src="${r.result}" alt="">`;window._selectedPhotoData=r.result};r.readAsDataURL(f)}
function saveTicket(e){
e.preventDefault();
try{
 const get=id=>document.getElementById(id);
 const id=get('editId').value;
 const old=tickets.find(t=>t.id===id);
 const f=get('photoPhotos').files[0];
 const d={
  id:id||uid(),
  title:get('title').value.trim(),
  date:get('date').value,
  time:get('time').value,
  venue:get('venue').value.trim(),
  seat:get('seat').value.trim(),
  price:get('price').value,
  companions:get('companions').value.trim(),
  notes:get('notes').value.trim(),
  cat:selectedCat,
  photo:'',
  used:old?.used||false,
  starred:old?.starred||false,
  createdAt:old?.createdAt||Date.now()
 };
 const finish=photo=>{
  d.photo=photo||'';
  if(id) tickets=tickets.map(t=>t.id===id?d:t);
  else tickets=[...tickets,d];
  persist();
  closeModal('formModal');
  renderTickets();
  toast(id?L().updated:L().added);
 };
 if(f){
  const r=new FileReader();
  r.onload=()=>finish(r.result);
  r.onerror=()=>finish(old?.photo||'');
  r.readAsDataURL(f);
 }else finish(old?.photo||'');
}catch(err){
 console.error('saveTicket error:',err);
 toast(appLang==='zh'?'儲存失敗，請再試一次':appLang==='ja'?'保存に失敗しました。もう一度お試しください':'Save failed. Please try again');
}
}
function deleteTicket(id){let t=tickets.find(x=>x.id===id);if(!t)return;if(confirm((appLang==='zh'?'確定要刪除「':appLang==='ja'?'「':'Delete “')+(t.title||L().unnamed)+(appLang==='zh'?'」嗎？':appLang==='ja'?'」を削除しますか？':'”?'))){tickets=tickets.filter(x=>x.id!==id);persist();renderTickets();closeModal('detailModal');toast(L().deleted)}}
function openDetail(id){let t=tickets.find(x=>x.id===id),c=catMap[t.cat]||catMap.other;if(!t)return;document.getElementById('detailContent').innerHTML=`${t.photo?`<img class="detail-photo" src="${t.photo}" alt="">`:`<div style="height:180px;border:1px dashed var(--line);border-radius:15px;display:grid;place-items:center;font-size:60px;background:#fff">${c.icon}</div>`}<h2>${esc(t.title||L().unnamed)}</h2><span class="badge">${c.icon} ${catName(t.cat)}</span><p style="color:var(--muted);line-height:1.8">${t.date?'📅 '+formatDate(t.date):''}${t.time?' · ⏰ '+t.time:''}<br>${t.venue?'📍 '+esc(t.venue):''}<br>${t.seat?'💺 '+esc(t.seat):''}<br>${t.price?money(t.price):''}${t.companions?'<br>👥 '+esc(t.companions):''}${t.notes?'<br>📝 '+esc(t.notes):''}</p><div class="action-row"><button onclick="quickShow('${id}')">${L().show}</button><button onclick="toggleStar('${id}')">${t.starred?L().favoriteRemove:L().favoriteAdd}</button><button onclick="openMap('${t.venue}')">${L().map}</button><button onclick="downloadICS('${id}')">${L().calendarAdd}</button><button onclick="toggleUsed('${id}')">${t.used?L().unusedBtn:L().usedBtn}</button><button onclick="duplicateTicket('${id}')">${L().duplicate}</button><button onclick="editTicket('${id}');closeModal('detailModal')">${L().edit}</button><button onclick="deleteTicket('${id}')">${L().delete}</button></div>`;let sh=document.querySelector('#detailModal .sheet');if(sh)sh.scrollTop=0;document.getElementById('detailModal').classList.add('open')}
function toggleStar(id){let t=tickets.find(x=>x.id===id);if(!t)return;t.starred=!t.starred;persist();renderTickets();openDetail(id);toast(t.starred?L().favOn:L().favOff)}
function toggleUsed(id){let t=tickets.find(x=>x.id===id);if(!t)return;t.used=!t.used;persist();renderTickets();openDetail(id);toast(t.used?L().usedToast:L().unusedToast)}
function duplicateTicket(id){let t=tickets.find(x=>x.id===id);if(!t)return;tickets.push({...t,id:uid(),title:(t.title||L().unnamed)+(appLang==='zh'?'（複製）':appLang==='ja'?'（複製）':' (Copy)') ,used:false,starred:false});persist();renderTickets();closeModal('detailModal');toast(L().copy)}
function renderCalendar(){let up=tickets.filter(t=>!t.used&&t.date&&daysUntil(t.date)>=0).sort((a,b)=>a.date.localeCompare(b.date)),past=tickets.filter(t=>t.date&&(t.used||daysUntil(t.date)<0)).sort((a,b)=>b.date.localeCompare(a.date));let rows=a=>a.length?a.map(t=>{let d=new Date(t.date+'T00:00:00'),c=catMap[t.cat]||catMap.other;return `<div class="event" onclick="openDetail('${t.id}')"><div class="datebox"><small>${d.getMonth()+1}${L().month}</small><b>${d.getDate()}</b></div><div class="event-main"><b>${c.icon} ${esc(t.title||L().unnamed)}</b><span>${t.time||L().timeMissing}${t.venue?' · 📍 '+esc(t.venue):''}</span></div></div>`}).join(''):`<div style="color:var(--muted);font-size:12px">${L().noData}</div>`;document.getElementById('calendarContent').innerHTML=`<div class="calendar-card"><div class="section-title">${L().calendarUpcoming}</div>${rows(up)}</div><div class="calendar-card"><div class="section-title">${L().calendarPast}</div>${rows(past)}</div>`}
function renderSpending(){let total=tickets.reduce((s,t)=>s+(Number(t.price)||0),0),p=tickets.filter(t=>Number(t.price)>0),avg=p.length?total/p.length:0,by={};tickets.forEach(t=>by[t.cat]=(by[t.cat]||0)+(Number(t.price)||0));let e=Object.entries(by).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),max=e[0]?.[1]||1,top=p.sort((a,b)=>b.price-a.price)[0];document.getElementById('spendingContent').innerHTML=`<div class="spend-card"><div style="color:var(--muted);font-size:11px">${L().spent}</div><div class="big-money">${money(total)}</div></div><div class="mini-grid"><div class="mini"><b>${money(Math.round(avg))}</b><span>${L().avg}</span></div><div class="mini"><b>${p.length}</b><span>${L().priced}</span></div></div>${top?`<div class="spend-card"><div style="color:var(--muted);font-size:11px">${L().most}</div><b>${esc(top.title||L().unnamed)}</b><div style="font-size:21px;font-weight:900">${money(top.price)}</div></div>`:''}<div class="spend-card"><div class="section-title">${L().byCat}</div>${e.length?e.map(([id,n])=>{let c=catMap[id]||catMap.other;return `<div class="bar"><div class="bar-label"><span>${c.icon} ${catName(id)}</span><b>${money(Math.round(n))}</b></div><div class="track"><div class="fill" style="width:${n/max*100}%"></div></div></div>`}).join(''):`<div style="color:var(--muted);font-size:12px">${L().analysisHint}</div>`}</div>`}
function openSettings(){let sh=document.querySelector('#settingsModal .sheet');if(sh)sh.scrollTop=0;applyLanguage();document.getElementById('settingsModal').classList.add('open')}
function confirmClearAll(){if(!tickets.length){toast(L().noTickets);return}let sh=document.querySelector('#confirmModal .sheet');if(sh)sh.scrollTop=0;document.getElementById('confirmModal').classList.add('open')}
function doClearAll(){tickets=[];persist();closeModal('confirmModal');closeModal('settingsModal');renderTickets();toast(appLang==='zh'?'已清除全部票券':appLang==='ja'?'すべてのチケットを削除しました':'All tickets cleared')}
function money(n){return 'NT$ '+(Number(n)||0).toLocaleString()}

applyLanguage();load();
</script>
</body></html>
